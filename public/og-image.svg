<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="630" viewBox="0 0 1200 630">
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#1e40af" />
      <stop offset="100%" stop-color="#4f46e5" />
    </linearGradient>
    <linearGradient id="accent" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#60a5fa" />
      <stop offset="100%" stop-color="#818cf8" />
    </linearGradient>
    <filter id="shadow" x="-20%" y="-20%" width="140%" height="140%">
      <feDropShadow dx="0" dy="20" stdDeviation="28" flood-color="#000" flood-opacity="0.25" />
    </filter>
  </defs>
  <rect width="1200" height="630" fill="url(#bg)" />
  <rect x="80" y="90" width="1040" height="450" rx="48" fill="#0f172a" opacity="0.15" />
  <g filter="url(#shadow)">
    <rect x="120" y="132" width="960" height="366" rx="42" fill="rgba(15, 23, 42, 0.95)" />
  </g>
  <text x="140" y="220" fill="#fff" font-family="Inter, sans-serif" font-size="60" font-weight="700">ContentPilot</text>
  <text x="140" y="292" fill="#c7d2fe" font-family="Inter, sans-serif" font-size="30" font-weight="500">AI-powered content planning and publishing for Facebook teams.</text>
  <g transform="translate(140 360)">
    <rect x="0" y="0" width="120" height="80" rx="26" fill="url(#accent)" />
    <rect x="148" y="0" width="120" height="80" rx="26" fill="rgba(255,255,255,0.08)" />
    <rect x="296" y="0" width="120" height="80" rx="26" fill="rgba(255,255,255,0.08)" />
    <rect x="444" y="0" width="120" height="80" rx="26" fill="rgba(255,255,255,0.08)" />
    <text x="48" y="48" fill="#fff" font-family="Inter, sans-serif" font-size="24" font-weight="700" text-anchor="middle">AI</text>
    <text x="196" y="48" fill="#fff" font-family="Inter, sans-serif" font-size="24" font-weight="700" text-anchor="middle">Queue</text>
    <text x="344" y="48" fill="#fff" font-family="Inter, sans-serif" font-size="24" font-weight="700" text-anchor="middle">Publish</text>
    <text x="492" y="48" fill="#fff" font-family="Inter, sans-serif" font-size="24" font-weight="700" text-anchor="middle">Analyze</text>
  </g>
</svg>
